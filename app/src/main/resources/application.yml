server:
  port: 8080

spring:
  application:
    name: tariff-calculator

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

currency:
  available:
    - "RUB"
cost:
  rub:
    perKg: 400
    minimal: 350
    perCubicMeter: 10000
    minDistanceKm: 450
geo:
  latitude:
    min: 45
    max: 65
  longitude:
    min: 30
    max: 96
dimension:
  maxLengthMm: 1500
  roundingStepMm: 50